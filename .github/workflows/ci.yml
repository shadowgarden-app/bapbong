name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Derive the SHAs for `nx affected` (base/head) on this run.
      - uses: nrwl/nx-set-shas@v4

      - run: pnpm exec nx format:check
      - run: pnpm exec nx affected -t lint test build typecheck
